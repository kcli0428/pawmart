services:
  db:
    image: postgres:16-alpine
    container_name: pawmart-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pawmart
    ports:
      - "5432:5432"
    volumes:
      - pawmart-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pawmart"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  pawmart-pgdata:
